name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
      id-token: write # required for OIDC / NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build NJobDesk.slnx --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Run unit tests
        run: dotnet test tests/NJobDesk.Tests --configuration Release --no-build

      - name: Run frontend tests
        working-directory: src/NJobDesk.AspNetCore/Client
        run: npm test

      - name: Pack
        run: dotnet pack NJobDesk.slnx --configuration Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (Trusted Publishing).
      # Configure the matching policy at nuget.org → your username → Trusted Publishing.
      - name: NuGet login (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
